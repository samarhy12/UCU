{% extends "layout_public.html" %}
{% block title %}Forgot password - Unity Credit Union{% endblock %}
{% block content %}
<div class="px-5 py-10 sm:py-16">
  <div class="w-full max-w-sm mx-auto">
    <h1 class="text-2xl mb-1.5">Forgot your password?</h1>
    <p class="text-ink-400 text-sm mb-7">Enter the email you used to sign up. We will send you a link to set a new password.</p>
    <form method="POST" class="card card-pad" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div class="field mb-5"><label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" inputmode="email" required autofocus /></div>
      <button type="submit" class="btn btn-gold btn-block">Send reset link</button>
      <p class="text-sm text-center mt-4"><a href="{{ url_for('auth.login') }}" class="text-navy-800 font-semibold underline">Back to sign in</a></p>
    </form>
  </div>
</div>
{% endblock %}
