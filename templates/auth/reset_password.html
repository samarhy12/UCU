{% extends "layout_public.html" %}
{% block title %}Set a new password - Unity Credit Union{% endblock %}
{% block content %}
<div class="px-5 py-10 sm:py-16">
  <div class="w-full max-w-sm mx-auto">
    <h1 class="text-2xl mb-1.5">Set a new password</h1>
    <p class="text-ink-400 text-sm mb-7">Use at least {{ config.PASSWORD_MIN_LENGTH }} characters.</p>
    <form method="POST" class="card card-pad" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div class="field mb-4"><label for="password">New password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" minlength="{{ config.PASSWORD_MIN_LENGTH }}" required autofocus /></div>
      <div class="field mb-5"><label for="confirm_password">Confirm new password</label>
        <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required /></div>
      <button type="submit" class="btn btn-gold btn-block">Save new password</button>
    </form>
  </div>
</div>
{% endblock %}
