{% extends "layout_public.html" %}
{% block title %}Something went wrong - Unity Credit Union{% endblock %}
{% block content %}
<div class="px-5 py-20 text-center max-w-md mx-auto">
  <div class="font-mono text-5xl text-gold-500 mb-3">400</div>
  <h1 class="text-2xl mb-2">Something went wrong</h1>
  <p class="text-ink-600 text-sm mb-6">{{ message or 'The request could not be completed. Please go back and try again.' }}</p>
  <div class="flex justify-center gap-3"><a href="javascript:history.back()" class="btn btn-outline">Go back</a><a href="{{ url_for('public.home') }}" class="btn btn-gold">Home</a></div>
</div>
{% endblock %}
