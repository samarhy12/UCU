<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{% block title %}Unity Credit Union{% endblock %}</title>
    <meta name="description" content="Unity Credit Union (UCU) - a susu savings and loan union. Save monthly, borrow at low rates, share in the yearly dividend." />

    <script>document.documentElement.classList.add("js");</script>
    <noscript><style>.js .reveal{opacity:1!important;transform:none!important}</style></noscript>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}" />
    <meta name="theme-color" content="#0A1220" />
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-180.png') }}" />
    <link rel="icon" href="{{ url_for('static', filename='icons/icon-32.png') }}" />

    <link rel="preload" href="{{ url_for('static', filename='fonts/inter-latin-wght-normal.woff2') }}" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="{{ url_for('static', filename='fonts/fraunces-latin-wght-normal.woff2') }}" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}" />
    <script defer src="{{ url_for('static', filename='vendor/alpine-3.14.1.min.js') }}"></script>
    {% block extra_head %}{% endblock %}
  </head>
  <body class="font-body text-ink-900 bg-cream-100">
    <div class="fixed top-4 right-4 z-[100] flex flex-col gap-2.5 max-w-[92vw] sm:max-w-sm">
      {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
      <div x-data="{ show: true }" x-show="show" x-init="setTimeout(() => show = false, 9000)" @click="show = false"
           x-transition:leave="transition ease-in duration-300" x-transition:leave-end="opacity-0 translate-x-6"
           class="flash {{ category }} cursor-pointer" role="status">{{ message }}</div>
      {% endfor %}
      {% endwith %}
    </div>

    {% block body %}{% endblock %}

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
  </body>
</html>
