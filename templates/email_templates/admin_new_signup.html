{% extends "email_templates/base_email.html" %}
{% block content %}
<p>A new member has signed up and is waiting for verification.</p><table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:14px 0;font-size:14px;"><tr><td style="padding:7px 0;color:#4B5364;border-bottom:1px solid #EFEBE0;">Name</td><td style="padding:7px 0;text-align:right;font-weight:bold;border-bottom:1px solid #EFEBE0;">{{ user.full_name }}</td></tr><tr><td style="padding:7px 0;color:#4B5364;border-bottom:1px solid #EFEBE0;">Phone</td><td style="padding:7px 0;text-align:right;font-weight:bold;border-bottom:1px solid #EFEBE0;">{{ user.phone_number }}</td></tr><tr><td style="padding:7px 0;color:#4B5364;border-bottom:1px solid #EFEBE0;">Email</td><td style="padding:7px 0;text-align:right;font-weight:bold;border-bottom:1px solid #EFEBE0;">{{ user.email }}</td></tr><tr><td style="padding:7px 0;color:#4B5364;border-bottom:1px solid #EFEBE0;">Ghana Card</td><td style="padding:7px 0;text-align:right;font-weight:bold;border-bottom:1px solid #EFEBE0;">{{ user.national_id }}</td></tr></table><p style="margin:22px 0;"><a href="{{ review_url }}" style="display:inline-block;background:#8A6B2E;color:#ffffff;text-decoration:none;padding:11px 22px;border-radius:4px;font-weight:bold;">Review sign-up</a></p>
{% endblock %}
