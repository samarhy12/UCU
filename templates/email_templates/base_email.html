<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>{{ subject }}</title></head>
<body style="margin:0;padding:0;background:#F6F4EF;font-family:Arial,Helvetica,sans-serif;color:#161E2C;line-height:1.6;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F6F4EF;"><tr><td align="center" style="padding:24px 12px;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background:#ffffff;border:1px solid #DEDACC;border-radius:4px;">
    <tr><td style="height:4px;background-color:#F2B51C;background:linear-gradient(90deg,#C8202F 0 33%,#F2B51C 33% 66%,#0E8F4D 66% 100%);font-size:0;line-height:0;">&nbsp;</td></tr>
    <tr><td style="background:#0A1220;padding:22px 24px;text-align:center;">
      <div style="font-family:Georgia,serif;font-size:22px;color:#ffffff;font-weight:bold;">Unity Credit Union</div>
      <div style="font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#C9A24A;margin-top:4px;">{% block heading %}{{ subject }}{% endblock %}</div>
    </td></tr>
    <tr><td style="padding:28px 24px;font-size:15px;">
      {% block content %}{% endblock %}
      <p style="margin:24px 0 0;">Best regards,<br>Unity Credit Union team<br><span style="color:#818A99;font-size:13px;">{{ org.motto }}</span></p>
    </td></tr>
    <tr><td style="background:#F6F4EF;border-top:1px solid #DEDACC;padding:16px 24px;text-align:center;font-size:12px;color:#818A99;">
      {{ org.email }} &middot; {{ org.phone }}<br>
      &copy; {{ current_year }} Unity Credit Union. This message was sent to {{ recipient_email }}.
    </td></tr>
  </table>
</td></tr></table>
</body></html>
