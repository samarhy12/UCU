{% extends "email_templates/base_email.html" %}
{% block content %}
<p>A visitor sent a message through the website.</p><table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:14px 0;font-size:14px;"><tr><td style="padding:7px 0;color:#4B5364;border-bottom:1px solid #EFEBE0;">Name</td><td style="padding:7px 0;text-align:right;font-weight:bold;border-bottom:1px solid #EFEBE0;">{{ user_name }}</td></tr><tr><td style="padding:7px 0;color:#4B5364;border-bottom:1px solid #EFEBE0;">Email</td><td style="padding:7px 0;text-align:right;font-weight:bold;border-bottom:1px solid #EFEBE0;">{{ user_email }}</td></tr><tr><td style="padding:7px 0;color:#4B5364;border-bottom:1px solid #EFEBE0;">Phone</td><td style="padding:7px 0;text-align:right;font-weight:bold;border-bottom:1px solid #EFEBE0;">{{ user_phone or "-" }}</td></tr></table><div style="background:#F6F4EF;border:1px solid #DEDACC;border-radius:4px;padding:14px 16px;margin:16px 0;">{{ message }}</div>
{% endblock %}
